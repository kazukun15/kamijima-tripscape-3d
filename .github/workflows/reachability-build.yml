name: Build reachability data
on:
  push:
    paths:
      - .github/workflows/reachability-build.yml
      - scripts/reachability-build/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Test data validation
        run: python3 scripts/reachability-build/test_fixture.py
      - name: Install OSM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
      - name: Restore completed routing graph
        id: graph-cache
        uses: actions/cache/restore@v4
        with:
          path: scripts/reachability-build/graph-cache
          key: ${{ runner.os }}-reachability-graph-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-reachability-graph-v1-
      - name: Build and verify candidate data
        run: bash scripts/reachability-build/run.sh
      # The graph checkpoint is finalized before status/canary/generation, so
      # preserve it even if those later validations fail. Never save a partial
      # build or duplicate an already-restored cache.
      - name: Check completed graph checkpoint
        id: graph-ready
        if: ${{ always() }}
        run: |
          if [ -s scripts/reachability-build/graph-cache/READY ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Save completed routing graph
        if: ${{ always() && steps.graph-ready.outputs.ready == 'true' && steps.graph-cache.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: scripts/reachability-build/graph-cache
          key: ${{ steps.graph-cache.outputs.cache-primary-key }}
      - name: Upload validated candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reachability-candidate
          path: scripts/reachability-build/generated/
          if-no-files-found: error
          retention-days: 7
